[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-model-diagnostics-pipeline"
version = "0.1.0"
description = "Few-shot CNN and recurrent forecasting experiments with leakage checks"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "torchvision>=0.20", "numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
diagnostics = "diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"diagnostics.report" = ["templates/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
