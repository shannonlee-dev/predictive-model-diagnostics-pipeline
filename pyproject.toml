[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-model-diagnostics-pipeline"
version = "0.1.0"
description = "이미지 분류·시계열 예측의 학습 조건·누수·실패 사례를 비교하는 PyTorch 모델 진단 파이프라인"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.0+cpu",
    "torchvision==0.29.0+cpu",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "pillow==12.3.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[project.scripts]
diagnostics = "diagnostics.cli:main"
diagnostics-search = "diagnostics.search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"diagnostics.report" = ["templates/*.md"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]
markers = ["smoke: 외부 서비스·원본 데이터 변경 없이 주요 실행 경로 검증"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
constraint-dependencies = [
    "setuptools==84.0.0",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "filelock==3.32.3",
    "fonttools==4.65.0",
    "fsspec==2026.7.0",
    "iniconfig==2.3.0",
    "jinja2==3.1.6",
    "kiwisolver==1.5.1",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "packaging==26.3",
    "pluggy==1.6.0",
    "pygments==2.21.0",
    "pyparsing==3.3.3",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "sympy==1.14.0",
    "typing-extensions==4.16.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
